      <stop offset="0%" stop-color="#1E6B52" />
      <stop offset="100%" stop-color="#134937" />
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4E6F4" />
      <stop offset="60%" stop-color="#C26DC0" />
      <stop offset="100%" stop-color="#8B3D88" />
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
